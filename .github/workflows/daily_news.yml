name: 每日新闻报告

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests


      - name: 语法检查
        run: python -m py_compile src/notifier.py src/main.py

      - name: 运行脚本
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SERVERCHAN_DEBUG: "1"
        run: python src/main.py
